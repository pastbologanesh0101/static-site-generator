{% extends "base.html" %}
{% block title %}Tag: {{ tag }}{% endblock %}
{% block content %}
<h1>Posts tagged &ldquo;{{ tag }}&rdquo;</h1>
<ul class="post-list">
  {% for post in posts %}
  <li>
    <a href="{{ post.url }}">{{ post.title }}</a>
    <time datetime="{{ post.date.strftime('%Y-%m-%d') }}">{{ post.date.strftime('%Y-%m-%d') }}</time>
  </li>
  {% else %}
  <li>No posts with this tag.</li>
  {% endfor %}
</ul>
{% endblock %}
